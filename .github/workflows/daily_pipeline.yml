name: Daily Price Pipeline

on:
  schedule:
    # 2:30 AM UTC = 7:30 AM PKT (Pakistan Standard Time)
    - cron: '30 2 * * *'
  workflow_dispatch:  # allow manual trigger from GitHub Actions tab

jobs:
  scrape-and-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create data directories
        run: mkdir -p data/images data/daily

      - name: Verify DB connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python3 - << 'EOF'
          import os
          import sys
          url = os.getenv("DATABASE_URL", "")
          if not url:
              print("❌ DATABASE_URL secret is not set!")
              sys.exit(1)
          print(f"✅ DATABASE_URL is set ({len(url)} chars)")
          # Test actual connection
          try:
              from sqlalchemy import create_engine, text
              engine = create_engine(url, connect_args={"connect_timeout": 10})
              with engine.connect() as conn:
                  result = conn.execute(text("SELECT COUNT(*) FROM price_readings"))
                  count = result.scalar()
                  print(f"✅ DB connected — {count} records in price_readings")
          except Exception as e:
              print(f"❌ DB connection failed: {e}")
              sys.exit(1)
          EOF

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MODE: 'false'
          ENV: production
        run: python scraper/pipeline.py

      - name: Upload daily JSON as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-prices-${{ github.run_id }}
          path: data/daily/
          retention-days: 30
